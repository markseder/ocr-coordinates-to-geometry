name: tests

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-coordinates-to-geometry
          path: dist/ocr_coordinates_to_geometry.zip
