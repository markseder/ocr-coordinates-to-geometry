name: Bug report
description: Report a reproducible recognition or geometry problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please remove confidential coordinates and personal information.
  - type: input
    id: qgis
    attributes:
      label: QGIS version
      placeholder: 4.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sanitized sample or screenshot
